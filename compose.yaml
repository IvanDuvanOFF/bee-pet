# BeeLLM в Docker: llama-server с OpenAI-совместимым API на http://127.0.0.1:8081
#   docker compose up -d      — запустить
#   docker compose logs -f    — посмотреть, как пчела просыпается
#   docker compose down       — остановить
services:
  beellm:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: beellm
    restart: unless-stopped
    command: >
      -hf schizophyllume/BeeLLM
      -c 4096
      --host 0.0.0.0
      --port 8080
    environment:
      # куда llama.cpp складывает скачанную модель
      LLAMA_CACHE: /models
    volumes:
      # модель качается один раз и переживает перезапуски контейнера
      # (:Z нужен для SELinux на Fedora, на Windows он просто игнорируется)
      - beellm-models:/models:Z
    ports:
      # наружу только на localhost, чтобы пчела не жужжала на всю сеть
      - "127.0.0.1:8081:8080"

volumes:
  beellm-models: